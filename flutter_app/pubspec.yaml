name: ceiling_calculator
description: Flutter port of the Kivy ceiling calculator (layout, materials, suppliers).
publish_to: "none"
# versionCode must stay above Kivy/Buildozer (e.g. 2.5.11 → 102120511)
version: 3.0.0+102120512

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  collection: ^1.19.1
  crypto: ^3.0.7
  http: ^1.2.2
  package_info_plus: ^10.2.2
  file_picker: ^12.1.0
  share_plus: ^13.3.0
  video_player: ^2.14.0
  video_player_win: ^3.2.2
  pdf: ^3.13.0
  image_picker: ^1.2.3
  archive: ^4.0.9
  roomplan_flutter: ^0.2.1
  printing: ^5.15.1
  flutter_onnxruntime: ^1.9.0
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/media/logo-visota.PNG
  adaptive_icon_background: "#1F2121"
  adaptive_icon_foreground: assets/media/logo-visota.PNG

flutter:
  uses-material-design: true
  assets:
    - assets/receipt_templates/
    - assets/document_templates/
    - assets/doc_import_templates/
    - assets/media/
    - assets/fonts/
    - assets/ml/room_walls.onnx
